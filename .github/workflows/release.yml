name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # 注意: リリース成果物を作るworkflowなのでキャッシュは使わない（cache poisoning対策）
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # manifest.json が zip のルートに来るように dist の中身を固める
      - name: Zip dist
        run: |
          cd dist
          zip -r "../prs-inbox-extension-${GITHUB_REF_NAME}.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            "prs-inbox-extension-${GITHUB_REF_NAME}.zip"
      # 公開はせずドラフト保存（dev）まで。手動で審査提出/公開する運用。
      - name: Upload to Chrome Web Store (draft, no publish)
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: prs-inbox-extension-${{ github.ref_name }}.zip
          extension-id: fmghddbkgblnhhgckmkcefehnmooojjf
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: false
