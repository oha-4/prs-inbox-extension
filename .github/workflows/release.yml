name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 注意: リリース成果物を作るworkflowなのでキャッシュは使わない（cache poisoning対策）
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: npm ci
      # manifest の version は package.json 由来（manifest.config.ts）。タグと食い違った
      # zip（例: 中身1.0.0なのに v1.1.0 としてリリース）を作らないよう先に検証する
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      # manifest.json が zip のルートに来るように dist の中身を固める
      - name: Zip dist
        run: |
          cd dist
          zip -r "../prs-inbox-extension-${GITHUB_REF_NAME}.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            "prs-inbox-extension-${GITHUB_REF_NAME}.zip"
