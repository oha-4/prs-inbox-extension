name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  biome:
    name: Biome (format / lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npx biome ci .

  test:
    name: Vitest + Codecov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC (tokenless upload for public repos)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      # v7.0.0: keybase移行で壊れたGPG鍵取得の修正を含む（v6.0.1以前はCLI署名検証で必ず失敗）
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true

  actionlint:
    name: Actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # .tool-versions の actionlint をインストール（このジョブに必要なのは actionlint だけ）
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: actionlint
      - run: actionlint -color

  pinact:
    name: Pinact (verify pinned actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # pinact-action v3.0.0 は pinact v4.0.0 を同梱（.tool-versions と一致させること）
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: 'false' # check-only: 未pinがあれば落とす（ファイルは変更しない）
          verify: 'true' # pin済みSHAがタグ実体と一致するか検証
          verify_min_age: 'true' # min_age(.github/pinact.yml: 7日) も検証
